<style>/* Hallmark · shape: app screen · genre: modern-minimal · theme: custom (Expressive Sport, from the 2026 research) · redesign: full
 * nav: none, one form · signature: the capsule field and button on the warm ground · states: asking, checking, wrong password, loading
 * axes: light+dark/Hiragino Sans/warm · posture: restrained · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P3 H4 E5 S3 R5 V3 · weakest: S, a password form is generic by nature; kept it to the site's ground, ink and capsule shapes */
:root{color-scheme:light dark;--space-1:4px;--space-2:8px;--space-3:12px;--space-6:24px;--r-pill:999px;--r-field:16px;
--font-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
--color-ground:#F0EEE9;--color-surface:#FFFFFF;--color-ink:#161513;--color-ink-2:#5E5B55;--color-edge:#8A867E;--color-on-ink:#FFFFFF;--color-track:#DCD9D1;--color-focus:#161513}
@media(prefers-color-scheme:dark){:root{--color-ground:#121110;--color-surface:#1B1A18;--color-ink:#F0EEE9;--color-ink-2:#A7A39A;--color-edge:#77736B;--color-on-ink:#1B1A18;--color-track:#33312E;--color-focus:#F0EEE9}}
*{box-sizing:border-box}html,body{overflow-x:clip}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--color-ground);color:var(--color-ink);font-family:var(--font-body);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased}
form{max-width:360px;margin:0 auto;padding:20vh var(--space-6) 0}
label{display:block;font-size:1.25rem;font-weight:700;margin-bottom:var(--space-3)}
input,button{display:block;width:100%;height:52px;font:inherit;-webkit-appearance:none;appearance:none}
input{padding:0 var(--space-3);border:1px solid var(--color-edge);border-radius:var(--r-field);background:var(--color-surface);color:var(--color-ink);font-size:1.0625rem}
button{margin-top:var(--space-3);border:0;border-radius:var(--r-pill);background:var(--color-ink);color:var(--color-on-ink);font-weight:700;cursor:pointer}
button:active{opacity:.85}button:disabled{opacity:.55;cursor:not-allowed}
input:focus-visible,button:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
#m{font-size:.9375rem;color:var(--color-ink-2);min-height:24px;margin:var(--space-3) 0 0;text-wrap:pretty;word-break:auto-phrase}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-3);color:var(--color-ink-2)}
#ld[hidden]{display:none}
#ld i{width:24px;height:24px;border-radius:50%;border:3px solid var(--color-track);border-top-color:var(--color-ink)}
@media(prefers-reduced-motion:no-preference){#ld i{animation:sp .8s linear infinite}}
@keyframes sp{to{transform:rotate(360deg)}}</style></head><body>
<div id="ld" role="status" hidden><i></i><span>読み込み中</span></div>
<form id="f" hidden><label for="p">パスワード</label><input id="p" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="b">開く</button><p id="m" aria-live="polite"></p></form>
